plugins { id 'com.android.application' }

android {
    // The Android shell and gomobile bindings are Java-only.
    enableKotlin = false
    namespace = 'org.ainovel.mobile'
    compileSdk = 35
    buildToolsVersion = '36.0.0'
    ndkVersion = '28.0.13004108'
    defaultConfig {
        applicationId = 'org.ainovel.mobile'
        minSdk = 26
        targetSdk = 35
        versionCode = 2
        versionName = '0.1.1'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig = true }
    buildTypes {
        release { minifyEnabled = false }
    }
    packaging {
        jniLibs { useLegacyPackaging = false }
        resources { excludes += ['META-INF/DEPENDENCIES'] }
    }
    // No signing secret is committed. Use debug for local installation, or
    // supply your own signing configuration for distribution.
}

dependencies { implementation files('libs/ainovel.aar') }
